<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Export Deal Desk</title>
    <style>
      :root { --ink: #14213d; --muted: #5c677d; --line: #e3e6ec; --bg: #f7f8fa; --card: #fff; --accent: #0b5fff; --ok: #1a7f4b; --bad: #b3261e; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); background: var(--bg); }
      main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { font-size: 24px; margin: 0 0 4px; }
      h2 { font-size: 16px; margin: 0 0 12px; }
      .muted { color: var(--muted); }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-top: 16px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; background: var(--bg); }
      .chip.ok { color: var(--ok); border-color: currentColor; }
      .chip.bad { color: var(--bad); border-color: currentColor; }
      .scroll { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
      th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
      td.num, th.num { text-align: right; }
      main.wide { max-width: 1180px; }
      .layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
      @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
      .card.tight { margin-top: 0; }
      .stack > * + * { margin-top: 16px; }
      label { display: block; font-size: 12px; color: var(--muted); margin-top: 10px; }
      input, textarea { width: 100%; font: inherit; color: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
      textarea { resize: vertical; min-height: 64px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      button { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; margin-top: 12px; }
      button.ghost { background: #fff; color: var(--accent); }
      button.danger { background: #fff; color: var(--bad); border-color: var(--bad); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .deal { display: block; width: 100%; text-align: left; background: #fff; color: var(--ink); border: 1px solid var(--line); font-weight: 400; margin-top: 8px; }
      .deal.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
      .chat { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
      .msg { max-width: 78%; }
      .msg.seller { align-self: flex-end; }
      .msg.system { align-self: center; max-width: 100%; font-size: 13px; color: var(--muted); }
      .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
      .msg.seller .who { text-align: right; }
      .bubble { padding: 10px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
      .msg.seller .bubble { background: #eaf1ff; border-color: #c9dafc; }
      .trace { font-size: 12.5px; border-radius: 8px; padding: 6px 10px; margin-bottom: 6px; border: 1px solid; overflow-wrap: anywhere; }
      .trace.blocked { color: var(--bad); background: #fdf1f0; }
      .trace.passed { color: var(--ok); background: #eef8f2; }
      .offer { margin-top: 6px; border: 1px solid var(--ink); border-radius: 10px; padding: 10px 12px; background: #fff; font-variant-numeric: tabular-nums; }
      .offer b { display: block; }
      .approval { border-color: #d9a400; background: #fffaf0; }
      .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 12px 0 0; }
      .kv dt { font-size: 12px; color: var(--muted); }
      .kv dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
