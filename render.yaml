# Render blueprint: one web service runs the API and serves the built React app.
# The database is an external Postgres server given in DATABASE_URL (for example a free Neon project).
# The embedded PGlite database used for local runs needs more memory than a free Render instance has.
services:
  - type: web
    name: export-deal-desk
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
